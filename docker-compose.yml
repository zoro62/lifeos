version: "3.9"

services:
  backend:
    build: ./backend
    container_name: lifeos-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  postgres:
    image: postgres:16-alpine
    container_name: lifeos-postgres
    restart: always
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lifeos_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lifeos-redis
    ports:
      - "6379:6379"

volumes:
  lifeos_pg_data:
